name: Build Browser VST

on: [push]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Fetch JUCE
      uses: actions/checkout@v4
      with:
        repository: juce-modules/JUCE
        path: JUCE
        ref: master

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Plugin
      run: cmake --build build --config Release

    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BrowserVST-Windows
        path: build/BrowserVST_artefacts/Release/VST3/
