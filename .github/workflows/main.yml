name: Build Browser VST

on: [push]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Clone JUCE
      run: git clone --depth 1 https://github.com/juce-modules/JUCE.git JUCE

    - name: Configure CMake
      run: cmake -B build -DCMAKE_BUILD_TYPE=Release

    - name: Build Plugin
      run: cmake --build build --config Release

    - name: Upload VST3 Artifact
      uses: actions/upload-artifact@v4
      with:
        name: BrowserVST-Windows
        path: build/BrowserVST_artefacts/Release/VST3/
